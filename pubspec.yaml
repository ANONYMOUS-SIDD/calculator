name: calculators
description: "A Flutter project for card game points calculator."
publish_to: 'none' # Private package

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.2.0
  flutter_animate: ^4.5.2
  lottie: ^3.3.2
  introduction_screen: ^4.0.0
  google_fonts: ^6.3.2
  flutter_onboarding_slider: ^1.0.11
  smooth_page_indicator: ^1.2.1
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  permission_handler: ^12.0.1
  device_info_plus: ^12.1.0
  get: ^4.7.2
  awesome_snackbar_content: ^0.1.8
  adaptive_dialog: ^2.5.0
  numberpicker: ^2.1.2
  path_provider: ^2.1.5
  intl: ^0.20.2
  table_calendar: ^3.2.0
  font_awesome_flutter: ^10.10.0
  liquid_swipe: ^3.1.0
  iconsax: ^0.0.8
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/Card-Mate.png"

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/lottie/
    - assets/fonts/Poppins/
    - assets/fonts/Quicksand/

